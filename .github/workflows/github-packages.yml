name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub Packages requires a scoped name: @<owner>/<name>.
      - name: Rescope package for the GitHub registry
        run: |
          node -e "
            const fs = require('node:fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.name = '@rajdeepdevelopment/smoke-monkey-harness';
            delete p.publishConfig;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
      # Skip if this version is already published: the release git tag v$VERSION
      # is created by the npm publish workflow when a version ships, so a tag
      # that already exists for the current package version means it's published.
      - name: Skip if this version is already published
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to GitHub Packages
        if: steps.check.outputs.exists == 'false'
        run: pnpm publish --no-git-checks --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}